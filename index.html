<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Geradores - Validação de Remessa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --sidebar-width: 310px;
            --sidebar-bg: #f0f7f0;
            --sidebar-header: #2e7d32;
            --bg-body: #f4f7f6;
            --card-bg: #ffffff;
            --text-dark: #1a1a2e;
            --text-muted: #6c757d;
            --border-color: #e0e5e9;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);

            --pnae-color: #1565C0;
            --faed-color: #E65100;
            --manut-color: #546E7A;
        }

        body {
            display: flex;
            height: 100vh;
            background: var(--bg-body);
            color: var(--text-dark);
            overflow: hidden;
        }

        /* BARRA LATERAL / ASIDE */
        aside {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid #c8e6c9;
            display: flex;
            flex-direction: column;
            padding: 20px 18px;
            overflow-y: auto;
            z-index: 10;
            transition: all 0.3s ease;
            height: 100vh;
        }

        aside.collapsed {
            width: 0;
            min-width: 0;
            padding: 0;
            overflow: hidden;
            border: none;
            opacity: 0;
            pointer-events: none;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--sidebar-header);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #a5d6a7;
        }

        .sidebar-header h2 {
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-toggle-sidebar {
            background: var(--sidebar-header);
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-toggle-sidebar:hover {
            background: #1b5e20;
        }

        /* PAINEL DE REMESSA */
        .remessa-section {
            background: #fff;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 14px;
            border: 2px solid #a5d6a7;
        }

        .remessa-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .remessa-header .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--sidebar-header);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remessa-header .panel-indicator {
            font-size: 0.6rem;
            background: var(--sidebar-header);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .badge-count {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--sidebar-header);
            color: #fff;
        }

        .remessa-search {
            position: relative;
            margin: 10px 0;
        }

        .remessa-search input {
            width: 100%;
            padding: 7px 10px 7px 32px;
            border: 1px solid #c8e6c9;
            border-radius: 6px;
            font-size: 0.78rem;
            outline: none;
        }

        .remessa-search input:focus {
            border-color: var(--sidebar-header);
        }

        .remessa-search i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .remessa-list-container {
            max-height: 220px;
            overflow-y: auto;
        }

        .remessa-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
            background: #f8fbf8;
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .remessa-item:hover {
            background: #e8f5e9;
        }

        .remessa-item.active {
            background: #a5d6a7;
            font-weight: 700;
            border-color: var(--sidebar-header);
        }

        .remessa-item .label {
            font-size: 0.75rem;
            color: var(--text-dark);
            word-break: break-all;
        }

        .remessa-item .badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            background: var(--sidebar-header);
            color: #fff;
        }

        .remessa-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            border-top: 2px solid #a5d6a7;
            margin-top: 8px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .btn-reset-filters {
            width: 100%;
            padding: 10px;
            background: var(--sidebar-header);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.82rem;
        }

        .btn-reset-filters:hover {
            background: #1b5e20;
        }

        .btn-expand-sidebar {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 99;
            background: var(--sidebar-header);
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }

        .btn-expand-sidebar.visible {
            display: flex;
        }

        /* ÁREA PRINCIPAL */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        header {
            background: #fff;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sheet-status {
            font-size: 0.78rem;
            color: var(--text-muted);
            background: #f0f4f1;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-dot.pnae { background: var(--pnae-color); }
        .status-dot.faed { background: var(--faed-color); }
        .status-dot.manut { background: var(--manut-color); }

        /* TABs */
        .tabs-container {
            background: #fff;
            border-bottom: 2px solid var(--border-color);
            padding: 0 24px;
            display: flex;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.tab-pnae.active { border-bottom-color: var(--pnae-color); color: var(--text-dark); }
        .tab-btn.tab-faed.active { border-bottom-color: var(--faed-color); color: var(--text-dark); }
        .tab-btn.tab-manut.active { border-bottom-color: var(--manut-color); color: var(--text-dark); }

        .content-body {
            padding: 16px 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* TABELA */
        .table-container {
            background: #fff;
            border-radius: 10px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            flex: 1;
            overflow: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        thead.pnae-header { background: var(--pnae-color); color: #fff; }
        thead.faed-header { background: var(--faed-color); color: #fff; }
        thead.manut-header { background: var(--manut-color); color: #fff; }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        tbody tr:hover { background: #e8f5e9; }
        
        .highlight-remessa {
            background: #fff9c4;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            color: #333;
        }
    </style>
</head>
<body>

    <button class="btn-expand-sidebar" id="btn-show-sidebar" onclick="toggleSidebar()">
        <i class="fa-solid fa-angles-right"></i>
    </button>

    <aside id="sidebar">
        <div class="sidebar-header">
            <h2><i class="fa-solid fa-sliders-h"></i> Filtros Painel</h2>
            <button class="btn-toggle-sidebar" onclick="toggleSidebar()">
                <i class="fa-solid fa-angles-left"></i>
            </button>
        </div>

        <div class="remessa-section">
            <div class="remessa-header">
                <div class="section-title">
                    <i class="fa-solid fa-clipboard-list"></i>
                    Validação Remessa
                    <span class="panel-indicator" id="remessa-panel-indicator">PNAE</span>
                </div>
                <span class="badge-count" id="remessa-badge-count">0</span>
            </div>
            
            <div class="remessa-search">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="remessa-search-input" placeholder="Pesquisar (ex: BB DIGITAL)..." oninput="filterRemessaList()">
            </div>

            <div class="remessa-list-container">
                <div id="remessa-list">
                    <div style="text-align:center; padding: 10px; font-size: 0.75rem; color: #666;">Carregando dados...</div>
                </div>
            </div>

            <div class="remessa-total">
                <span>Total Linhas</span>
                <span id="remessa-total-value">0</span>
            </div>
        </div>

        <button class="btn-reset-filters" onclick="resetAllFilters()">
            <i class="fa-solid fa-rotate-left"></i> Limpar Filtros
        </button>
    </aside>

    <main>
        <header>
            <h1><i class="fa-solid fa-table-list"></i> Painel Geradores de Remessa</h1>
            <div class="sheet-status">
                <div class="status-dot pnae" id="status-dot"></div>
                <span>Aba Ativa: <strong id="sheet-name">Backup_Remessa_Pnae</strong></span>
            </div>
        </header>

        <div class="tabs-container">
            <button class="tab-btn tab-pnae active" id="btn-pnae" onclick="switchTab('Backup_Remessa_Pnae')">
                <i class="fas fa-utensils"></i> PNAE
            </button>
            <button class="tab-btn tab-faed" id="btn-faed" onclick="switchTab('Backup_Remessa_Faed')">
                <i class="fas fa-hand-holding-heart"></i> FAED
            </button>
            <button class="tab-btn tab-manut" id="btn-manut" onclick="switchTab('Backup_Remessa_Manut')">
                <i class="fas fa-tools"></i> Manutenção
            </button>
        </div>

        <div class="content-body">
            <div class="table-container">
                <table>
                    <thead id="table-head" class="pnae-header">
                        <!-- Gerado dinamicamente -->
                    </thead>
                    <tbody id="tbody-painel">
                        <tr><td colspan="10" style="text-align: center;">Carregando planilha...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // MOCK DE DADOS PARA TESTE LOCAL (Caso rode fora do Google Apps Script)
        const LOCAL_MOCK = {
            'Backup_Remessa_Pnae': [
                ["ColA", "ColB", "ColC", "ColD", "ColE", "Unidade Escolar", "Diretor", "Id Custro", "Cartão", "Valor Orig", "Valor Banco", "Valor Max", "891", "5/11/2026", "parcela alimenta..."],
                ["ColA", "ColB", "ColC", "ColD", "ColE", "DO DE EDUCACAO BASICA PROFIS", "RAQUEL ALVES", "186241084", "4098690054808459", "21.719,20", "21.720,00", "63.767,00", "BB DIGITAL", "5/26/2026", "parcela alimenta..."],
                ["ColA", "ColB", "ColC", "ColD", "ColE", "DO DE EDUCACAO BASICA PROFIS", "RAQUEL ALVES", "186241084", "4098690054808459", "21.719,20", "21.720,00", "43.439,00", "897", "6/1/2026", "parcela alimenta..."],
                ["ColA", "ColB", "ColC", "ColD", "ColE", "ESTADUAL DE TEMPO INTEGRAL", "WN ALMIR OLIVEIRA", "175848753", "4098699679387146", "37.007,20", "37.008,00", "185.516,00", "899", "6/8/2026", "parcela alimenta..."]
            ],
            'Backup_Remessa_Faed': [
                ["ColA", "ColB", "ColC", "ColD", "ColE", "ESCOLA FAED 1", "DIRETOR A", "123", "40986000000", "10.000,00", "10.000,00", "20.000,00", "FAED-2026", "6/1/2026", "parcela..."],
                ["ColA", "ColB", "ColC", "ColD", "ColE", "ESCOLA FAED 2", "DIRETOR B", "124", "40986000001", "15.000,00", "15.000,00", "30.000,00", "BB DIGITAL", "6/2/2026", "parcela..."]
            ],
            'Backup_Remessa_Manut': [
                ["ColA", "ColB", "ColC", "ColD", "ColE", "ESCOLA MANUT 1", "DIRETOR C", "125", "40986000002", "5.000,00", "5.000,00", "10.000,00", "VAL", "DAT", "MNT-550"],
                ["ColA", "ColB", "ColC", "ColD", "ColE", "ESCOLA MANUT 2", "DIRETOR D", "126", "40986000003", "8.000,00", "8.000,00", "16.000,00", "VAL", "DAT", "BB DIGITAL"]
            ]
        };

        let currentTab = 'Backup_Remessa_Pnae';
        let rawSheetData = [];
        let selectedRemessaFilter = null;

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btnShow = document.getElementById('btn-show-sidebar');
            sidebar.classList.toggle('collapsed');
            btnShow.classList.toggle('visible', sidebar.classList.contains('collapsed'));
        }

        // RETORNA A REMESSA INDEPENDENTE DO TIPO DE DADO (PRESERVA "BB DIGITAL")
        function getRemessaFromRow(row, tabName) {
            let val = "";
            if (tabName === 'Backup_Remessa_Pnae' || tabName === 'Backup_Remessa_Faed') {
                val = row[12]; // Coluna M = Índice 12
            } else if (tabName === 'Backup_Remessa_Manut') {
                val = row[14]; // Coluna O = Índice 14
            }

            if (val !== undefined && val !== null) {
                return String(val).trim();
            }
            return "";
        }

        function switchTab(tabName) {
            currentTab = tabName;
            selectedRemessaFilter = null;
            document.getElementById('remessa-search-input').value = '';

            // Estilos do Cabeçalho e Botões
            document.getElementById('sheet-name').textContent = tabName;
            const dot = document.getElementById('status-dot');
            const indicator = document.getElementById('remessa-panel-indicator');

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (tabName === 'Backup_Remessa_Pnae') {
                document.getElementById('btn-pnae').classList.add('active');
                dot.className = "status-dot pnae";
                indicator.textContent = "PNAE";
            } else if (tabName === 'Backup_Remessa_Faed') {
                document.getElementById('btn-faed').classList.add('active');
                dot.className = "status-dot faed";
                indicator.textContent = "FAED";
            } else {
                document.getElementById('btn-manut').classList.add('active');
                dot.className = "status-dot manut";
                indicator.textContent = "MANUT";
            }

            loadData(tabName);
        }

        function loadData(tabName) {
            const tbody = document.getElementById('tbody-painel');
            tbody.innerHTML = `<tr><td colspan="10" style="text-align: center;">Carregando dados da aba ${tabName}...</td></tr>`;

            // Verifica se está dentro do ambiente Apps Script
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(response => {
                        if (response.success) {
                            rawSheetData = response.data;
                            processAndRender();
                        } else {
                            tbody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: red;">Erro: ${response.error}</td></tr>`;
                        }
                    })
                    .getDadosAba(tabName);
            } else {
                // Fallback de teste local
                setTimeout(() => {
                    rawSheetData = LOCAL_MOCK[tabName] || [];
                    processAndRender();
                }, 300);
            }
        }

        function processAndRender() {
            renderHeader(currentTab);
            renderRemessaSidebar(currentTab);
            renderTable(currentTab);
        }

        function renderHeader(tabName) {
            const thead = document.getElementById('table-head');
            if (tabName === 'Backup_Remessa_Manut') {
                thead.className = 'manut-header';
                thead.innerHTML = `
                    <tr>
                        <th>Unidade Escolar</th>
                        <th>Diretor(a)</th>
                        <th>Id Custro</th>
                        <th>Cartão</th>
                        <th>Valor Original</th>
                        <th>Valor Banco</th>
                        <th>Remessa (Coluna O)</th>
                    </tr>
                `;
            } else {
                thead.className = tabName === 'Backup_Remessa_Pnae' ? 'pnae-header' : 'faed-header';
                thead.innerHTML = `
                    <tr>
                        <th>Unidade Escolar</th>
                        <th>Diretor(a)</th>
                        <th>Id Custro</th>
                        <th>Cartão</th>
                        <th>Valor Original</th>
                        <th>Valor Banco</th>
                        <th>Valor Máximo</th>
                        <th>Remessa (Coluna M)</th>
                        <th>Data Remessa</th>
                    </tr>
                `;
            }
        }

        function renderRemessaSidebar(tabName) {
            const container = document.getElementById('remessa-list');
            const badgeCount = document.getElementById('remessa-badge-count');
            const totalValue = document.getElementById('remessa-total-value');

            // Extrai todos os valores válidos
            const remessas = rawSheetData
                .map(row => getRemessaFromRow(row, tabName))
                .filter(val => val !== "" && val !== "Remessa"); // Descarta cabeçalho se houver

            if (remessas.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:10px; font-size:0.75rem;">Nenhuma remessa encontrada.</div>`;
                badgeCount.textContent = '0';
                totalValue.textContent = '0';
                return;
            }

            // Agrupa as remessas mantendo o valor exato ("BB DIGITAL", "891", etc)
            const contagem = {};
            remessas.forEach(r => {
                contagem[r] = (contagem[r] || 0) + 1;
            });

            let html = '';
            Object.keys(contagem).forEach(remessaKey => {
                const activeClass = selectedRemessaFilter === remessaKey ? 'active' : '';
                html += `
                    <div class="remessa-item ${activeClass}" onclick="filterByRemessa('${remessaKey}')">
                        <span class="label">${remessaKey}</span>
                        <span class="badge">${contagem[remessaKey]}</span>
                    </div>
                `;
            });

            container.innerHTML = html;
            badgeCount.textContent = Object.keys(contagem).length;
            totalValue.textContent = remessas.length;
        }

        function filterByRemessa(remessaKey) {
            if (selectedRemessaFilter === remessaKey) {
                selectedRemessaFilter = null; // Desativa filtro se clicar nele novamente
            } else {
                selectedRemessaFilter = remessaKey;
            }
            renderRemessaSidebar(currentTab);
            renderTable(currentTab);
        }

        function filterRemessaList() {
            const query = document.getElementById('remessa-search-input').value.toLowerCase().trim();
            const items = document.querySelectorAll('.remessa-item');
            
            items.forEach(item => {
                const label = item.querySelector('.label').textContent.toLowerCase();
                item.style.display = label.includes(query) ? 'flex' : 'none';
            });
        }

        function renderTable(tabName) {
            const tbody = document.getElementById('tbody-painel');
            let rows = rawSheetData;

            // Aplica filtro por clique no painel lateral
            if (selectedRemessaFilter !== null) {
                rows = rows.filter(row => getRemessaFromRow(row, tabName) === selectedRemessaFilter);
            }

            if (rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" style="text-align: center;">Nenhum registro encontrado.</td></tr>`;
                return;
            }

            let html = '';
            rows.forEach(row => {
                const remessaVal = getRemessaFromRow(row, tabName);

                // Evita renderizar a linha de cabeçalho da planilha se ela estiver no meio dos dados
                if (remessaVal === 'Remessa') return;

                if (tabName === 'Backup_Remessa_Manut') {
                    html += `
                        <tr>
                            <td>${row[5] || ''}</td>
                            <td>${row[6] || ''}</td>
                            <td>${row[7] || ''}</td>
                            <td>${row[8] || ''}</td>
                            <td>${row[9] || ''}</td>
                            <td>${row[10] || ''}</td>
                            <td><span class="highlight-remessa">${remessaVal}</span></td>
                        </tr>
                    `;
                } else {
                    html += `
                        <tr>
                            <td>${row[5] || ''}</td>
                            <td>${row[6] || ''}</td>
                            <td>${row[7] || ''}</td>
                            <td>${row[8] || ''}</td>
                            <td>${row[9] || ''}</td>
                            <td>${row[10] || ''}</td>
                            <td>${row[11] || ''}</td>
                            <td><span class="highlight-remessa">${remessaVal}</span></td>
                            <td>${row[13] || ''}</td>
                        </tr>
                    `;
                }
            });

            tbody.innerHTML = html;
        }

        function resetAllFilters() {
            selectedRemessaFilter = null;
            document.getElementById('remessa-search-input').value = '';
            renderRemessaSidebar(currentTab);
            renderTable(currentTab);
        }

        // Inicializa ao carregar a página
        document.addEventListener('DOMContentLoaded', () => {
            switchTab('Backup_Remessa_Pnae');
        });
    </script>
</body>
</html>
