<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão - PNAE | FAED | Manutenção</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --sidebar-width: 300px;
            --sidebar-bg: #f0f7f0;
            --sidebar-header: #2e7d32;
            --bg-body: #f4f7f6;
            --card-bg: #ffffff;
            --text-dark: #1a1a2e;
            --text-muted: #6c757d;
            --border-color: #e0e5e9;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --success: #2e7d32;
            --warning: #f57c00;
            --danger: #c62828;
            --blue-divider: #1a73e8;

            --pnae-color: #1565C0;
            --pnae-light: #e3f2fd;
            --faed-color: #E65100;
            --faed-light: #fff3e0;
            --manut-color: #546E7A;
            --manut-light: #eceff1;
        }

        body {
            display: flex;
            height: 100vh;
            background: var(--bg-body);
            color: var(--text-dark);
            overflow: hidden;
        }

        aside {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid #c8e6c9;
            display: flex;
            flex-direction: column;
            padding: 20px 18px;
            overflow-y: auto;
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            flex-shrink: 0;
            height: 100vh;
        }

        aside.collapsed {
            width: 0;
            min-width: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
            border: none;
            opacity: 0;
            pointer-events: none;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--sidebar-header);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #a5d6a7;
            flex-shrink: 0;
        }

        .sidebar-header h2 {
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-toggle-sidebar {
            background: var(--sidebar-header);
            color: #fff;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-toggle-sidebar:hover {
            background: #1b5e20;
            transform: scale(1.05);
        }

        .filter-group {
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        .filter-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--sidebar-header);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #c8e6c9;
            border-radius: 8px;
            background: #fff;
            font-size: 0.82rem;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s;
        }

        .filter-group select:focus {
            border-color: var(--sidebar-header);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.15);
        }

        .search-input-wrapper {
            position: relative;
        }

        .search-input-wrapper input {
            width: 100%;
            padding: 7px 12px 7px 34px;
            border: 1px solid #c8e6c9;
            border-radius: 8px;
            font-size: 0.82rem;
            outline: none;
            transition: all 0.2s;
            background: #fafbfc;
        }

        .search-input-wrapper input:focus {
            border-color: var(--sidebar-header);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .search-input-wrapper i {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .btn-reset-filters {
            width: 100%;
            padding: 9px;
            background: var(--sidebar-header);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
            flex-shrink: 0;
            font-size: 0.82rem;
        }

        .btn-reset-filters:hover {
            background: #1b5e20;
            transform: scale(1.02);
        }

        .remessa-section {
            background: #fff;
            border-radius: 10px;
            padding: 14px 16px;
            margin: 8px 0 14px 0;
            border: 2px solid #a5d6a7;
            flex-shrink: 0;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .remessa-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .remessa-header .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--sidebar-header);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remessa-header .section-title .panel-indicator {
            font-size: 0.55rem;
            background: var(--sidebar-header);
            color: #fff;
            padding: 1px 8px;
            border-radius: 10px;
            font-weight: 700;
        }

        .remessa-toggle-btn {
            background: transparent;
            border: none;
            color: var(--sidebar-header);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .remessa-toggle-btn:hover {
            background: #e8f5e9;
        }

        .remessa-toggle-btn .badge-count {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--sidebar-header);
            color: #fff;
        }

        .remessa-body {
            overflow: hidden;
            transition: all 0.3s ease;
            max-height: 500px;
        }

        .remessa-body.collapsed {
            max-height: 0;
            padding-top: 0;
            margin-top: 0;
        }

        .remessa-body-inner {
            padding-top: 10px;
        }

        .remessa-search {
            position: relative;
            margin-bottom: 10px;
        }

        .remessa-search input {
            width: 100%;
            padding: 6px 10px 6px 32px;
            border: 1px solid #c8e6c9;
            border-radius: 6px;
            font-size: 0.78rem;
            outline: none;
            transition: all 0.2s;
            background: #fafbfc;
        }

        .remessa-search input:focus {
            border-color: var(--sidebar-header);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .remessa-search i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .remessa-list-container {
            max-height: 180px;
            overflow-y: auto;
        }

        .remessa-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 8px;
            border-radius: 6px;
            margin-bottom: 3px;
            background: #f8fbf8;
            transition: all 0.2s;
            cursor: pointer;
        }

        .remessa-item:hover {
            background: #e8f5e9;
        }

        .remessa-item.active {
            background: #a5d6a7;
            font-weight: 600;
        }

        .remessa-item .label {
            font-size: 0.73rem;
            font-weight: 500;
            color: var(--text-dark);
            word-break: break-all;
        }

        .remessa-item .badge {
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            background: var(--sidebar-header);
            color: #fff;
            min-width: 24px;
            text-align: center;
            margin-left: 8px;
        }

        .remessa-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            border-top: 2px solid #a5d6a7;
            margin-top: 6px;
        }

        .remessa-total .label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .remessa-total .value {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--sidebar-header);
        }

        .remessa-empty {
            padding: 10px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .btn-expand-sidebar {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 99;
            background: var(--sidebar-header);
            color: #fff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(27, 94, 32, 0.3);
            transition: all 0.2s;
            font-size: 1.2rem;
        }

        .btn-expand-sidebar.visible {
            display: flex;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        header {
            background: #fff;
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 i {
            color: var(--sidebar-header);
        }

        .sheet-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: #f0f4f1;
            padding: 4px 14px;
            border-radius: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.pnae { background: var(--pnae-color); }
        .status-dot.faed { background: var(--faed-color); }
        .status-dot.manut { background: var(--manut-color); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .tabs-container {
            background: #fff;
            border-bottom: 2px solid var(--border-color);
            padding: 0 24px;
            display: flex;
            gap: 0;
            flex-shrink: 0;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 3px solid transparent;
        }

        .tab-btn:hover {
            color: var(--text-dark);
            background: #f8f9fa;
        }

        .tab-btn.active {
            color: var(--text-dark);
            border-bottom-width: 3px;
        }

        .tab-btn.tab-pnae.active { border-bottom-color: var(--pnae-color); }
        .tab-btn.tab-pnae .tab-icon { color: var(--pnae-color); }

        .tab-btn.tab-faed.active { border-bottom-color: var(--faed-color); }
        .tab-btn.tab-faed .tab-icon { color: var(--faed-color); }

        .tab-btn.tab-manut.active { border-bottom-color: var(--manut-color); }
        .tab-btn.tab-manut .tab-icon { color: var(--manut-color); }

        .content-body {
            padding: 16px 24px;
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .panel-content {
            display: none;
            flex-direction: column;
            gap: 14px;
            flex: 1;
            overflow: hidden;
        }

        .panel-content.active {
            display: flex;
        }

        .blue-divider {
            background: linear-gradient(90deg, var(--blue-divider), #4fc3f7);
            height: 3px;
            border: none;
            border-radius: 2px;
            margin: 2px 0 6px 0;
            flex-shrink: 0;
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            flex-shrink: 0;
        }

        .search-card {
            background: #fff;
            padding: 14px 18px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .search-card h3 {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-container {
            background: #fff;
            border-radius: 10px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            flex: 1;
            overflow: auto;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        thead.pnae-header { background: var(--pnae-color); color: #fff; }
        thead.faed-header { background: var(--faed-color); color: #fff; }
        thead.manut-header { background: var(--manut-color); color: #fff; }

        th, td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        tbody tr:nth-child(even) { background: #f9fbf9; }
        tbody tr:hover { background: #e8f5e9; }
    </style>
</head>
<body>

    <button class="btn-expand-sidebar" id="btn-show-sidebar" onclick="toggleSidebar()" title="Exibir Filtros">
        <i class="fa-solid fa-angles-right"></i>
    </button>

    <aside id="sidebar">
        <div class="sidebar-header">
            <h2><i class="fa-solid fa-sliders-h"></i> Filtros</h2>
            <button class="btn-toggle-sidebar" onclick="toggleSidebar()" title="Ocultar Menu">
                <i class="fa-solid fa-angles-left"></i>
            </button>
        </div>

        <div class="filter-group">
            <label><i class="fa-regular fa-circle-dot"></i> NTE</label>
            <select id="filter-nte">
                <option value="">Todos os NTEs</option>
            </select>
        </div>

        <div class="filter-group">
            <label><i class="fa-regular fa-building"></i> Município</label>
            <select id="filter-municipio">
                <option value="">Todos os Municípios</option>
            </select>
        </div>

        <div class="remessa-section" id="remessa-section">
            <div class="remessa-header" onclick="toggleRemessa()">
                <div class="section-title">
                    <i class="fa-solid fa-clipboard-list"></i>
                    Validação Remessa
                    <span class="panel-indicator" id="remessa-panel-indicator">MANUT</span>
                </div>
                <button class="remessa-toggle-btn" id="remessa-toggle-btn">
                    <span class="badge-count" id="remessa-badge-count">0</span>
                    <i class="fa-solid fa-chevron-up" id="remessa-chevron"></i>
                </button>
            </div>
            
            <div class="remessa-body" id="remessa-body">
                <div class="remessa-body-inner">
                    <div class="remessa-search">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="remessa-search-input" placeholder="Filtrar remessa..." oninput="filterRemessaList()">
                    </div>
                    <div class="remessa-list-container">
                        <div id="remessa-list">
                            <div class="remessa-empty">Carregando dados...</div>
                        </div>
                    </div>
                    <div class="remessa-total">
                        <span class="label">Total Registros</span>
                        <span class="value" id="remessa-total-value">0</span>
                    </div>
                </div>
            </div>
        </div>

        <button class="btn-reset-filters" onclick="resetAllFilters()">
            <i class="fa-solid fa-rotate-left"></i> Limpar Filtros
        </button>
    </aside>

    <main>
        <header>
            <h1><i class="fa-solid fa-chart-pie"></i> <span id="painel-title">Sistema de Gestão</span></h1>
            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="sheet-status">
                    <div class="status-dot manut" id="status-dot"></div>
                    <span>Aba: <strong id="sheet-name">Backup_Remessa_Manut</strong></span>
                </div>
            </div>
        </header>

        <div class="tabs-container">
            <button class="tab-btn tab-pnae" data-tab="pnae" onclick="switchTab('pnae')">
                <i class="fas fa-utensils tab-icon"></i> PNAE
            </button>
            <button class="tab-btn tab-faed" data-tab="faed" onclick="switchTab('faed')">
                <i class="fas fa-hand-holding-heart tab-icon"></i> FAED
            </button>
            <button class="tab-btn tab-manut active" data-tab="manut" onclick="switchTab('manut')">
                <i class="fas fa-tools tab-icon"></i> Manutenção
            </button>
        </div>

        <div class="content-body">
            
            <!-- Painel PNAE -->
            <div class="panel-content" id="panel-pnae">
                <div class="blue-divider"></div>
                <div class="table-container">
                    <table>
                        <thead class="pnae-header">
                            <tr>
                                <th>Cod SEC</th>
                                <th>Escola</th>
                                <th>NTE</th>
                                <th>Município</th>
                                <th>Remessa (Col M)</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-pnae"></tbody>
                    </table>
                </div>
            </div>

            <!-- Painel FAED -->
            <div class="panel-content" id="panel-faed">
                <div class="blue-divider"></div>
                <div class="table-container">
                    <table>
                        <thead class="faed-header">
                            <tr>
                                <th>Cod SEC</th>
                                <th>Escola</th>
                                <th>NTE</th>
                                <th>Município</th>
                                <th>Remessa (Col M)</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-faed"></tbody>
                    </table>
                </div>
            </div>

            <!-- Painel Manutenção -->
            <div class="panel-content active" id="panel-manut">
                <div class="blue-divider"></div>
                <div class="table-container">
                    <table>
                        <thead class="manut-header">
                            <tr>
                                <th>Cod SEC</th>
                                <th>Escola</th>
                                <th>NTE</th>
                                <th>Município</th>
                                <th>Outra Info</th>
                                <th>Remessa (Col O)</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-manut"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Dados Mock simulando as abas da planilha
        // Coluna M = índice 12 | Coluna O = índice 14
        const MOCK_DATA = {
            pnae: [
                ["1001", "Escola A", "NTE 01", "Salvador", "", "", "", "", "", "", "", "", "REM-2026-01"],
                ["1002", "Escola B", "NTE 02", "Feira de Santana", "", "", "", "", "", "", "", "", "105923"],
                ["1003", "Escola C", "NTE 01", "Salvador", "", "", "", "", "", "", "", "", "REM-2026-01"]
            ],
            faed: [
                ["2001", "Escola D", "NTE 03", "Vitória da Conquista", "", "", "", "", "", "", "", "", "FAED-889"],
                ["2002", "Escola E", "NTE 01", "Salvador", "", "", "", "", "", "", "", "", "994012"]
            ],
            manut: [
                ["3001", "Escola F", "NTE 01", "Salvador", "X", "Y", "", "", "", "", "", "", "", "", "MNT-TEXTO-100"],
                ["3002", "Escola G", "NTE 04", "Camaçari", "X", "Y", "", "", "", "", "", "", "", "", "554109"],
                ["3003", "Escola H", "NTE 01", "Salvador", "X", "Y", "", "", "", "", "", "", "", "", "MNT-TEXTO-100"]
            ]
        };

        let currentTab = 'manut';
        let selectedRemessaFilter = null;

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btnShow = document.getElementById('btn-show-sidebar');
            sidebar.classList.toggle('collapsed');
            btnShow.classList.toggle('visible', sidebar.classList.contains('collapsed'));
        }

        function toggleRemessa() {
            const body = document.getElementById('remessa-body');
            const chevron = document.getElementById('remessa-chevron');
            body.classList.toggle('collapsed');
            chevron.classList.toggle('fa-chevron-down');
            chevron.classList.toggle('fa-chevron-up');
        }

        function switchTab(tab) {
            currentTab = tab;
            selectedRemessaFilter = null;

            // Atualiza botões
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            // Atualiza painéis
            document.querySelectorAll('.panel-content').forEach(panel => {
                panel.classList.remove('active');
            });
            document.getElementById(`panel-${tab}`).classList.add('active');

            // Atualiza status da barra superior
            const dot = document.getElementById('status-dot');
            const sheetName = document.getElementById('sheet-name');
            dot.className = `status-dot ${tab}`;

            if(tab === 'pnae') sheetName.textContent = 'Backup_Remessa_Pnae';
            else if(tab === 'faed') sheetName.textContent = 'Backup_Remessa_Faed';
            else if(tab === 'manut') sheetName.textContent = 'Backup_Remessa_Manut';

            // Recarrega tabelas e a lista lateral de Remessa
            renderTable(tab);
            renderRemessaSidebar(tab);
        }

        // LÓGICA PRINCIPAL DE LEITURA DA COLUNA M (PNAE/FAED) E O (MANUT)
        function getRemessaValue(tab, row) {
            let value = '';
            if (tab === 'pnae' || tab === 'faed') {
                // Coluna M corresponde ao índice 12
                value = row[12];
            } else if (tab === 'manut') {
                // Coluna O corresponde ao índice 14
                value = row[14];
            }
            // Garante a leitura de qualquer formato (Texto ou Número)
            return (value !== undefined && value !== null) ? String(value).trim() : '';
        }

        function renderRemessaSidebar(tab) {
            const container = document.getElementById('remessa-list');
            const badgeCount = document.getElementById('remessa-badge-count');
            const totalValue = document.getElementById('remessa-total-value');
            const indicator = document.getElementById('remessa-panel-indicator');

            indicator.textContent = tab.toUpperCase();

            const rows = MOCK_DATA[tab] || [];
            
            // Mapeia e captura todos os elementos da coluna de remessa correspondente
            const remessas = rows
                .map(row => getRemessaValue(tab, row))
                .filter(val => val !== '');

            if (remessas.length === 0) {
                container.innerHTML = `<div class="remessa-empty">Nenhuma remessa encontrada</div>`;
                badgeCount.textContent = '0';
                totalValue.textContent = '0';
                return;
            }

            // Agrupa e conta as ocorrências de cada valor de remessa
            const contagem = {};
            remessas.forEach(r => {
                contagem[r] = (contagem[r] || 0) + 1;
            });

            let html = '';
            Object.keys(contagem).forEach(remessaKey => {
                const activeClass = selectedRemessaFilter === remessaKey ? 'active' : '';
                html += `
                    <div class="remessa-item ${activeClass}" onclick="filterByRemessa('${remessaKey}')">
                        <span class="label">${remessaKey}</span>
                        <span class="badge">${contagem[remessaKey]}</span>
                    </div>
                `;
            });

            container.innerHTML = html;
            badgeCount.textContent = Object.keys(contagem).length;
            totalValue.textContent = remessas.length;
        }

        function filterByRemessa(remessaKey) {
            if (selectedRemessaFilter === remessaKey) {
                selectedRemessaFilter = null; // desativa se clicar novamente
            } else {
                selectedRemessaFilter = remessaKey;
            }
            renderRemessaSidebar(currentTab);
            renderTable(currentTab);
        }

        function filterRemessaList() {
            const query = document.getElementById('remessa-search-input').value.toLowerCase();
            const items = document.querySelectorAll('.remessa-item');
            items.forEach(item => {
                const label = item.querySelector('.label').textContent.toLowerCase();
                item.style.display = label.includes(query) ? 'flex' : 'none';
            });
        }

        function renderTable(tab) {
            const tbody = document.getElementById(`tbody-${tab}`);
            let rows = MOCK_DATA[tab] || [];

            if (selectedRemessaFilter) {
                rows = rows.filter(row => getRemessaValue(tab, row) === selectedRemessaFilter);
            }

            let html = '';
            rows.forEach(row => {
                const remessaVal = getRemessaValue(tab, row);
                if (tab === 'manut') {
                    html += `
                        <tr>
                            <td>${row[0]}</td>
                            <td>${row[1]}</td>
                            <td>${row[2]}</td>
                            <td>${row[3]}</td>
                            <td>${row[4]}</td>
                            <td><strong>${remessaVal}</strong></td>
                        </tr>
                    `;
                } else {
                    html += `
                        <tr>
                            <td>${row[0]}</td>
                            <td>${row[1]}</td>
                            <td>${row[2]}</td>
                            <td>${row[3]}</td>
                            <td><strong>${remessaVal}</strong></td>
                        </tr>
                    `;
                }
            });

            tbody.innerHTML = html || `<tr><td colspan="6" style="text-align:center;">Nenhum registro encontrado.</td></tr>`;
        }

        function resetAllFilters() {
            selectedRemessaFilter = null;
            document.getElementById('remessa-search-input').value = '';
            renderRemessaSidebar(currentTab);
            renderTable(currentTab);
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            switchTab('manut');
        });
    </script>
</body>
</html>
