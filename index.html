<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Geradores - Validação de Remessa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --sidebar-width: 320px;
            --sidebar-bg: #f0f7f0;
            --sidebar-header: #2e7d32;
            --bg-body: #f4f7f6;
            --card-bg: #ffffff;
            --text-dark: #1a1a2e;
            --text-muted: #6c757d;
            --border-color: #e0e5e9;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);

            --pnae-color: #1565C0;
            --faed-color: #E65100;
            --manut-color: #546E7A;
        }

        body {
            display: flex;
            height: 100vh;
            background: var(--bg-body);
            color: var(--text-dark);
            overflow: hidden;
        }

        /* BARRA LATERAL / MENU */
        aside {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid #c8e6c9;
            display: flex;
            flex-direction: column;
            padding: 18px 16px;
            overflow-y: auto;
            z-index: 10;
            transition: all 0.3s ease;
            height: 100vh;
            gap: 14px;
        }

        aside.collapsed {
            width: 0;
            min-width: 0;
            padding: 0;
            overflow: hidden;
            border: none;
            opacity: 0;
            pointer-events: none;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--sidebar-header);
            padding-bottom: 10px;
            border-bottom: 2px solid #a5d6a7;
        }

        .sidebar-header h2 {
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-toggle-sidebar {
            background: var(--sidebar-header);
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-toggle-sidebar:hover {
            background: #1b5e20;
        }

        /* PESQUISA GERAL NO MENU */
        .filter-section-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--sidebar-header);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group-search {
            position: relative;
        }

        .input-group-search input {
            width: 100%;
            padding: 8px 10px 8px 32px;
            border: 1px solid #a5d6a7;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
            background: #fff;
            transition: border-color 0.2s;
        }

        .input-group-search input:focus {
            border-color: var(--sidebar-header);
            box-shadow: 0 0 0 2px rgba(46, 125, 50, 0.15);
        }

        .input-group-search i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* CARDS DE RESUMO NO MENU */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .card-stat {
            background: #fff;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #c8e6c9;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-stat .card-title {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .card-stat .card-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--sidebar-header);
        }

        /* PAINEL DE VALIDAÇÃO DE REMESSA NO MENU */
        .remessa-section {
            background: #fff;
            border-radius: 10px;
            padding: 12px;
            border: 2px solid #a5d6a7;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .remessa-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-indicator {
            font-size: 0.65rem;
            background: var(--sidebar-header);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 700;
        }

        .badge-count {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--sidebar-header);
            color: #fff;
        }

        .remessa-list-container {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e8f5e9;
            border-radius: 6px;
            padding: 4px;
            background: #fafdfa;
        }

        .remessa-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
            background: #ffffff;
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid #e0e0e0;
        }

        .remessa-item:hover {
            background: #e8f5e9;
            border-color: #a5d6a7;
        }

        .remessa-item.active {
            background: #a5d6a7;
            font-weight: 700;
            border-color: var(--sidebar-header);
            color: #1b5e20;
        }

        .remessa-item .label {
            font-size: 0.78rem;
            word-break: break-all;
        }

        .remessa-item .badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            background: var(--sidebar-header);
            color: #fff;
        }

        .remessa-item.active .badge {
            background: #1b5e20;
        }

        .btn-reset-filters {
            width: 100%;
            padding: 10px;
            background: var(--sidebar-header);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.82rem;
            transition: background 0.2s;
        }

        .btn-reset-filters:hover {
            background: #1b5e20;
        }

        .btn-expand-sidebar {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 99;
            background: var(--sidebar-header);
            color: #fff;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }

        .btn-expand-sidebar.visible {
            display: flex;
        }

        /* ÁREA PRINCIPAL */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        header {
            background: #fff;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sheet-status {
            font-size: 0.78rem;
            color: var(--text-muted);
            background: #f0f4f1;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-dot.pnae { background: var(--pnae-color); }
        .status-dot.faed { background: var(--faed-color); }
        .status-dot.manut { background: var(--manut-color); }

        /* TABs DE ABAS DA PLANILHA */
        .tabs-container {
            background: #fff;
            border-bottom: 2px solid var(--border-color);
            padding: 0 24px;
            display: flex;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.tab-pnae.active { border-bottom-color: var(--pnae-color); color: var(--text-dark); }
        .tab-btn.tab-faed.active { border-bottom-color: var(--faed-color); color: var(--text-dark); }
        .tab-btn.tab-manut.active { border-bottom-color: var(--manut-color); color: var(--text-dark); }

        .content-body {
            padding: 16px 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* TABELA DE DADOS */
        .table-container {
            background: #fff;
            border-radius: 10px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            flex: 1;
            overflow: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        thead.pnae-header { background: var(--pnae-color); color: #fff; }
        thead.faed-header { background: var(--faed-color); color: #fff; }
        thead.manut-header { background: var(--manut-color); color: #fff; }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        tbody tr:hover { background: #e8f5e9; }
        
        .highlight-remessa {
            background: #fff9c4;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 700;
            color: #333;
            border: 1px solid #fbc02d;
            display: inline-block;
        }
    </style>
</head>
<body>

    <button class="btn-expand-sidebar" id="btn-show-sidebar" onclick="toggleSidebar()">
        <i class="fa-solid fa-angles-right"></i>
    </button>

    <aside id="sidebar">
        <!-- CABEÇALHO DO MENU -->
        <div class="sidebar-header">
            <h2><i class="fa-solid fa-sliders-h"></i> Painel de Filtros</h2>
            <button class="btn-toggle-sidebar" onclick="toggleSidebar()">
                <i class="fa-solid fa-angles-left"></i>
            </button>
        </div>

        <!-- 1. PESQUISA GERAL (TEXTO GLOBAL) -->
        <div>
            <div class="filter-section-title">
                <i class="fa-solid fa-magnifying-glass"></i> Pesquisa Geral
            </div>
            <div class="input-group-search">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="global-search-input" placeholder="Buscar Escola, Diretor, ID..." oninput="renderTable()">
            </div>
        </div>

        <!-- 2. CARDS DE RESUMO DA ABA ATIVA -->
        <div>
            <div class="filter-section-title">
                <i class="fa-solid fa-chart-pie"></i> Resumo Geral
            </div>
            <div class="cards-grid">
                <div class="card-stat">
                    <span class="card-title">Total Linhas</span>
                    <span class="card-value" id="card-total-linhas">0</span>
                </div>
                <div class="card-stat">
                    <span class="card-title">Remessas</span>
                    <span class="card-value" id="card-total-remessas">0</span>
                </div>
            </div>
        </div>

        <!-- 3. PAINEL / LISTA DE VALIDAÇÃO DE REMESSAS -->
        <div class="remessa-section">
            <div class="remessa-header">
                <div class="filter-section-title" style="margin: 0;">
                    <i class="fa-solid fa-clipboard-check"></i> Validação Remessa
                    <span class="panel-indicator" id="remessa-panel-indicator">PNAE</span>
                </div>
                <span class="badge-count" id="remessa-badge-count">0</span>
            </div>
            
            <!-- PESQUISA ESPECÍFICA DE REMESSAS -->
            <div class="input-group-search">
                <i class="fa-solid fa-filter"></i>
                <input type="text" id="remessa-search-input" placeholder="Filtrar remessa (ex: BB DIGITAL)..." oninput="filterRemessaList()">
            </div>

            <!-- LISTA DE REMESSAS COM OCORRÊNCIAS -->
            <div class="remessa-list-container">
                <div id="remessa-list">
                    <div style="text-align:center; padding: 10px; font-size: 0.75rem; color: #666;">Carregando...</div>
                </div>
            </div>
        </div>

        <!-- BOTÃO PARA LIMPAR TODOS OS FILTROS -->
        <button class="btn-reset-filters" onclick="resetAllFilters()">
            <i class="fa-solid fa-rotate-left"></i> Limpar Filtros
        </button>
    </aside>

    <main>
        <header>
            <h1><i class="fa-solid fa-table-list"></i> Sistema Remessa Web</h1>
            <div class="sheet-status">
                <div class="status-dot pnae" id="status-dot"></div>
                <span>Aba Ativa: <strong id="sheet-name">Backup_Remessa_Pnae</strong></span>
            </div>
        </header>

        <!-- NAVEGAÇÃO ENTRE AS ABAS -->
        <div class="tabs-container">
            <button class="tab-btn tab-pnae active" id="btn-pnae" onclick="switchTab('Backup_Remessa_Pnae')">
                <i class="fas fa-utensils"></i> Backup_Remessa_Pnae
            </button>
            <button class="tab-btn tab-faed" id="btn-faed" onclick="switchTab('Backup_Remessa_Faed')">
                <i class="fas fa-hand-holding-heart"></i> Backup_Remessa_Faed
            </button>
            <button class="tab-btn tab-manut" id="btn-manut" onclick="switchTab('Backup_Remessa_Manut')">
                <i class="fas fa-tools"></i> Backup_Remessa_Manut
            </button>
        </div>

        <div class="content-body">
            <div class="table-container">
                <table>
                    <thead id="table-head" class="pnae-header">
                        <!-- Gerado dinamicamente -->
                    </thead>
                    <tbody id="tbody-painel">
                        <tr><td colspan="10" style="text-align: center;">Carregando planilha...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // MOCK PARA TESTE LOCAL
        const LOCAL_MOCK = {
            'Backup_Remessa_Pnae': [
                ["ColA", "ColB", "ColC", "ColD", "ColE", "ESTADUAL INDIGENA NOSSA SENHORA DE LOURDES", "IEZES (PRESIDENTE D)", "175887030", "4098699672243551", "1.243,00", "1.243,00", "4.407,00", "891", "5/11/2026", "parcela alimenta..."],
                ["ColA", "ColB", "ColC", "ColD", "ColE", "DO DE EDUCACAO BASICA PROFIS E TECNOLOGICA", "RAQUEL ALVES CONC", "186241084", "4098690054808459", "21.719,20", "21.720,00", "63.767,00", "BB DIGITAL", "5/26/2026", "parcela alimenta..."],
                ["ColA", "ColB", "ColC", "ColD", "ColE", "DO DE EDUCACAO BASICA PROFIS E TECNOLOGICA", "RAQUEL ALVES CONC", "186241084", "4098690054808459", "21.719,20", "21.720,00", "43.439,00", "897", "6/1/2026", "parcela alimenta..."],
                ["ColA", "ColB", "ColC", "ColD", "ColE", "ESTADUAL DE TEMPO INTEGRAL LOMANTO JUNIOR", "WN ALMIR OLIVEIRA", "175848753", "4098699679387146", "37.007,20", "37.008,00", "185.516,00", "899", "6/8/2026", "parcela alimenta..."]
            ],
            'Backup_Remessa_Faed': [
                ["ColA", "ColB", "ColC", "ColD", "ColE", "ESCOLA FAED SANTA CRUZ", "DIRETOR MARCOS", "123456", "409860000001", "10.000,00", "10.000,00", "20.000,00", "891", "6/1/2026", "parcela..."],
                ["ColA", "ColB", "ColC", "ColD", "ColE", "CENTRO DE FORMACAO FAED", "DIRETORA SILVIA", "123457", "409860000002", "15.000,00", "15.000,00", "30.000,00", "BB DIGITAL", "6/2/2026", "parcela..."]
            ],
            'Backup_Remessa_Manut': [
                ["ColA", "ColB", "ColC", "ColD", "ColE", "COL_A", "COL_B", "COL_C", "COL_D", "COL_E", "ESCOLA MANUTENCAO CENTRAL", "DIRETOR CARLOS", "1750001", "40986000003", "BB DIGITAL", "RESGATE", "9157.2026.005574"],
                ["ColA", "ColB", "ColC", "ColD", "ColE", "COL_A", "COL_B", "COL_C", "COL_D", "COL_E", "COL_MANUT_02", "DIRETORA AMANDA", "1750002", "40986000004", "899", "parcela...", "9157.2026.005575"]
            ]
        };

        let currentTab = 'Backup_Remessa_Pnae';
        let rawSheetData = [];
        let selectedRemessaFilter = null;

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btnShow = document.getElementById('btn-show-sidebar');
            sidebar.classList.toggle('collapsed');
            btnShow.classList.toggle('visible', sidebar.classList.contains('collapsed'));
        }

        // EXTRAI A REMESSA SEM DESCARTE DE TEXTOS ("BB DIGITAL")
        function getRemessaFromRow(row, tabName) {
            let val = "";
            if (tabName === 'Backup_Remessa_Pnae' || tabName === 'Backup_Remessa_Faed') {
                val = row[12]; // Coluna M = Índice 12
            } else if (tabName === 'Backup_Remessa_Manut') {
                val = row[14]; // Coluna O = Índice 14
            }

            if (val !== undefined && val !== null) {
                return String(val).trim();
            }
            return "";
        }

        function switchTab(tabName) {
            currentTab = tabName;
            selectedRemessaFilter = null;
            document.getElementById('global-search-input').value = '';
            document.getElementById('remessa-search-input').value = '';

            document.getElementById('sheet-name').textContent = tabName;
            const dot = document.getElementById('status-dot');
            const indicator = document.getElementById('remessa-panel-indicator');

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (tabName === 'Backup_Remessa_Pnae') {
                document.getElementById('btn-pnae').classList.add('active');
                dot.className = "status-dot pnae";
                indicator.textContent = "PNAE";
            } else if (tabName === 'Backup_Remessa_Faed') {
                document.getElementById('btn-faed').classList.add('active');
                dot.className = "status-dot faed";
                indicator.textContent = "FAED";
            } else {
                document.getElementById('btn-manut').classList.add('active');
                dot.className = "status-dot manut";
                indicator.textContent = "MANUT";
            }

            loadData(tabName);
        }

        function loadData(tabName) {
            const tbody = document.getElementById('tbody-painel');
            tbody.innerHTML = `<tr><td colspan="10" style="text-align: center;">Carregando dados da aba ${tabName}...</td></tr>`;

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(response => {
                        if (response.success) {
                            rawSheetData = response.data;
                            processAndRender();
                        } else {
                            tbody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: red;">Erro: ${response.error}</td></tr>`;
                        }
                    })
                    .getDadosAba(tabName);
            } else {
                setTimeout(() => {
                    rawSheetData = LOCAL_MOCK[tabName] || [];
                    processAndRender();
                }, 200);
            }
        }

        function processAndRender() {
            renderHeader(currentTab);
            renderRemessaSidebar(currentTab);
            renderTable();
        }

        function renderHeader(tabName) {
            const thead = document.getElementById('table-head');
            if (tabName === 'Backup_Remessa_Manut') {
                thead.className = 'manut-header';
                thead.innerHTML = `
                    <tr>
                        <th>Unidade Escolar</th>
                        <th>Diretor(a)</th>
                        <th>Id Custo</th>
                        <th>Cartão</th>
                        <th>Remessa (Coluna O)</th>
                        <th>Finalidade</th>
                        <th>Processo</th>
                    </tr>
                `;
            } else {
                thead.className = tabName === 'Backup_Remessa_Pnae' ? 'pnae-header' : 'faed-header';
                thead.innerHTML = `
                    <tr>
                        <th>Unidade Escolar</th>
                        <th>Diretor(a)</th>
                        <th>Id Custo</th>
                        <th>Cartão</th>
                        <th>Valor Original</th>
                        <th>Valor Banco</th>
                        <th>Valor Máximo</th>
                        <th>Remessa (Coluna M)</th>
                        <th>Data Remessa</th>
                        <th>Finalidade</th>
                    </tr>
                `;
            }
        }

        function renderRemessaSidebar(tabName) {
            const container = document.getElementById('remessa-list');
            const badgeCount = document.getElementById('remessa-badge-count');
            const cardTotalLinhas = document.getElementById('card-total-linhas');
            const cardTotalRemessas = document.getElementById('card-total-remessas');

            const remessas = rawSheetData
                .map(row => getRemessaFromRow(row, tabName))
                .filter(val => val !== "" && val !== "Remessa");

            cardTotalLinhas.textContent = remessas.length;

            if (remessas.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:10px; font-size:0.75rem;">Nenhuma remessa encontrada.</div>`;
                badgeCount.textContent = '0';
                cardTotalRemessas.textContent = '0';
                return;
            }

            const contagem = {};
            remessas.forEach(r => {
                contagem[r] = (contagem[r] || 0) + 1;
            });

            const totalRemessasDistintas = Object.keys(contagem).length;
            badgeCount.textContent = totalRemessasDistintas;
            cardTotalRemessas.textContent = totalRemessasDistintas;

            let html = '';
            Object.keys(contagem).forEach(remessaKey => {
                const activeClass = selectedRemessaFilter === remessaKey ? 'active' : '';
                html += `
                    <div class="remessa-item ${activeClass}" onclick="filterByRemessa('${remessaKey}')">
                        <span class="label">${remessaKey}</span>
                        <span class="badge">${contagem[remessaKey]}</span>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function filterByRemessa(remessaKey) {
            if (selectedRemessaFilter === remessaKey) {
                selectedRemessaFilter = null;
            } else {
                selectedRemessaFilter = remessaKey;
            }
            renderRemessaSidebar(currentTab);
            renderTable();
        }

        function filterRemessaList() {
            const query = document.getElementById('remessa-search-input').value.toLowerCase().trim();
            const items = document.querySelectorAll('.remessa-item');
            
            items.forEach(item => {
                const label = item.querySelector('.label').textContent.toLowerCase();
                item.style.display = label.includes(query) ? 'flex' : 'none';
            });
        }

        function renderTable() {
            const tbody = document.getElementById('tbody-painel');
            const globalQuery = document.getElementById('global-search-input').value.toLowerCase().trim();
            let rows = rawSheetData;

            // 1. Filtro por clique na lista de remessas
            if (selectedRemessaFilter !== null) {
                rows = rows.filter(row => getRemessaFromRow(row, currentTab) === selectedRemessaFilter);
            }

            // 2. Filtro pela caixa de pesquisa geral
            if (globalQuery !== '') {
                rows = rows.filter(row => {
                    return row.some(cell => String(cell).toLowerCase().includes(globalQuery));
                });
            }

            if (rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" style="text-align: center;">Nenhum registro encontrado.</td></tr>`;
                return;
            }

            let html = '';
            rows.forEach(row => {
                const remessaVal = getRemessaFromRow(row, currentTab);

                // Evita repetir linha de cabeçalho
                if (remessaVal === 'Remessa') return;

                if (currentTab === 'Backup_Remessa_Manut') {
                    html += `
                        <tr>
                            <td>${row[10] || row[5] || ''}</td>
                            <td>${row[11] || row[6] || ''}</td>
                            <td>${row[12] || row[7] || ''}</td>
                            <td>${row[13] || row[8] || ''}</td>
                            <td><span class="highlight-remessa">${remessaVal}</span></td>
                            <td>${row[15] || ''}</td>
                            <td>${row[16] || ''}</td>
                        </tr>
                    `;
                } else {
                    html += `
                        <tr>
                            <td>${row[5] || ''}</td>
                            <td>${row[6] || ''}</td>
                            <td>${row[7] || ''}</td>
                            <td>${row[8] || ''}</td>
                            <td>${row[9] || ''}</td>
                            <td>${row[10] || ''}</td>
                            <td>${row[11] || ''}</td>
                            <td><span class="highlight-remessa">${remessaVal}</span></td>
                            <td>${row[13] || ''}</td>
                            <td>${row[14] || ''}</td>
                        </tr>
                    `;
                }
            });

            tbody.innerHTML = html;
        }

        function resetAllFilters() {
            selectedRemessaFilter = null;
            document.getElementById('global-search-input').value = '';
            document.getElementById('remessa-search-input').value = '';
            filterRemessaList();
            renderRemessaSidebar(currentTab);
            renderTable();
        }

        document.addEventListener('DOMContentLoaded', () => {
            switchTab('Backup_Remessa_Pnae');
        });
    </script>
</body>
</html>
